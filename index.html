<!doctype html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manba AI — shaxsiy ta’lim yordamchingiz</title>
<meta name="description" content="Manba AI: o‘zbek tilidagi AI ustoz, testlar, flashkartalar, referat va slaydlar.">
<meta name="theme-color" content="#040813">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="earth.webp">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" onload="this.rel='stylesheet'">

<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="ig" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="24"><stop offset="0" stop-color="#b79cff"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs></svg>
<div id="cosmos" aria-hidden="true"><canvas id="stars"></canvas><div class="sunglow"></div><div class="lay" id="layE"><canvas id="bgEarth"></canvas></div><div class="lay" id="layM"><canvas id="bgMoon"></canvas></div><div class="vig"></div></div>
<div class="app">
  <header class="top">
    <button class="icon-btn menu-btn" id="menu" aria-label="Menyuni ochish"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a class="brand" href="#/home"><img src="icon.svg" alt="" width="38" height="38"><span><b>Manba AI</b><small>Cosmic Learning</small></span></a>
    <button class="search" id="srch" type="button"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>Manba AI da izlash… (dars, test, mavzu)</span><kbd>Ctrl + K</kbd></button>
    <div class="top-r">
      <button class="pro-pill" id="pro2" type="button"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20h20M4 20 2 7l6 5 4-8 4 8 6-5-2 13"/></svg><span>Pro</span></button>
      <a class="icon-btn" href="#/reminders" aria-label="Eslatmalar"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><i class="bdg" id="bdg" hidden></i></a>
      <button class="lang" id="lang" type="button">UZ <span aria-hidden="true">⌄</span></button>
      <div class="themeseg" role="group" aria-label="Mavzu"><button data-th="light" aria-label="Yorug‘ mavzu"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button data-th="dark" aria-label="Qorong‘i mavzu"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
      <a class="me" href="#/settings"><b class="av">M</b><span><b>Manba AI</b><small>Bepul rejim</small></span></a>
    </div>
    <b id="clock" hidden></b><small id="date" hidden></small><span id="ptitle" hidden></span>
  </header>
  <aside class="side" id="side" aria-label="Asosiy menyu"><nav id="nav"></nav></aside>
  <div class="main"><main id="view" tabindex="-1"></main></div>
  <nav class="bnav" aria-label="Tezkor menyu"></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">Manba AI ishlashi uchun JavaScript yoqilgan bo‘lishi kerak.</p></noscript>
<script src="app.js" defer></script>
</body>
</html>
