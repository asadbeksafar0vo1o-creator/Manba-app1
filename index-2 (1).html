<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4e89">
<title>Manba</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192-1.png">
<link rel="apple-touch-icon" href="icon-192-1.png">
<style>
:root{--bg:#f2f5f6;--cd:#fff;--tx:#14213d;--mt:#5d6b7e;--ac:#1d4e89;--at:#fff;--bd:#d9e0e6;--hl:#f2b705;--er:#b3261e}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#0f151c;--cd:#18212b;--tx:#e6ebf2;--mt:#93a1b3;--ac:#6fa8ff;--at:#0f151c;--bd:#2a3644}}
:root[data-t=dark]{--bg:#0f151c;--cd:#18212b;--tx:#e6ebf2;--mt:#93a1b3;--ac:#6fa8ff;--at:#0f151c;--bd:#2a3644}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd)}
header b{font:700 22px Georgia,serif;letter-spacing:.3px;flex:1}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ib{background:none;border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
main{flex:1;min-height:0;position:relative}
section{display:none;height:100%;overflow:auto;padding:14px}
section.on{display:block}
#v-chat.on{display:flex;flex-direction:column;padding:0}
nav{display:flex;border-top:1px solid var(--bd);background:var(--cd);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;border:0;padding:12px 4px;color:var(--mt);font-size:14px}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
h2{font:700 18px Georgia,serif;margin:0 0 8px}
label{display:block;font-size:14px;color:var(--mt);margin:10px 0 4px}
input[type=text],input[type=password],textarea,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px}
textarea{min-height:110px;resize:vertical}
.pb{background:var(--ac);color:var(--at);border:0;border-radius:8px;padding:9px 14px;font-weight:600}
.sb{background:none;border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.src{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.src small{color:var(--mt)}
.bar{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--bd)}
.bar select{flex:1}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:9px 12px;border-radius:12px;background:var(--cd);border:1px solid var(--bd);overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--ac);color:var(--at);border-color:var(--ac)}
.m.e{border-color:var(--er);color:var(--er)}
.ref{background:var(--hl);color:#14213d;border:0;border-radius:6px;min-width:22px;height:22px;font-size:12px;font-weight:700;margin:0 1px;vertical-align:baseline}
.tts{background:none;border:0;padding:4px 0 0;font-size:13px;color:var(--mt)}
.dots i{animation:bl 1.2s infinite;font-style:normal}
.dots i:nth-child(3){animation-delay:.2s}.dots i:nth-child(4){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.2}30%{opacity:1}}
@media(prefers-reduced-motion:reduce){.dots i{animation:none}}
#pan{display:none;margin:0 12px 8px;padding:10px;border-left:4px solid var(--hl);background:var(--cd);border-radius:8px;font-size:14px}
#pan.on{display:block}
.in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--bd);background:var(--cd)}
.in textarea{min-height:44px;height:44px;resize:none}
.empty{color:var(--mt);text-align:center;padding:24px 8px}
[hidden]{display:none!important}
nav button{font-size:12.5px;padding:12px 2px}
.mt{color:var(--mt);font-size:14px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:8px 0;transition:background .3s}
.opt.ok{background:#1b7f4b;color:#fff;border-color:#1b7f4b}.opt.no{background:#b3261e;color:#fff;border-color:#b3261e}
.pr{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:6px 0}.pr i{display:block;height:100%;background:var(--ac);transition:width .3s}
.fc{perspective:900px;height:220px;margin:12px 0;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fc.flip .fi{transform:rotateY(180deg)}
.ff,.fb2{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;-webkit-backface-visibility:hidden;backface-visibility:hidden;font:600 20px Georgia,serif;overflow:auto}
.fb2{transform:rotateY(180deg);background:var(--ac);color:var(--at)}
@media(prefers-reduced-motion:reduce){.fi,.pr i{transition:none}}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:8px 0}
nav button span{font-size:18px;line-height:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--ac);color:var(--at);border-color:var(--ac)}
#tr{margin-top:12px}
pre{overflow:auto;background:var(--bg);border:1px solid var(--bd);padding:10px;border-radius:8px;font-size:13px}
.wk{display:flex;gap:8px;align-items:flex-end;height:110px;margin-top:8px}
.wk div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mt)}
.wk i{display:block;width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;transition:height .5s}
.big{font:700 34px Georgia,serif}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sg b{display:block;font:700 22px Georgia,serif}
/* Neon-shisha mavzu */
:root{--ac:#4f46e5}
:root[data-t=dark]{--bg:#070a16;--cd:rgba(255,255,255,.05);--tx:#e9ecff;--mt:#9aa4cf;--ac:#7c6cff;--at:#fff;--bd:rgba(140,130,255,.22);--hl:#5de0ff}
:root[data-t=dark] body{background:radial-gradient(520px 380px at 85% -8%,rgba(108,92,255,.28),transparent),radial-gradient(480px 380px at -12% 108%,rgba(47,123,255,.22),transparent),#070a16}
:root[data-t=dark] .cd,:root[data-t=dark] nav,:root[data-t=dark] .in{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
:root[data-t=dark] .cd{box-shadow:0 0 24px rgba(108,92,255,.12)}
:root[data-t=dark] .ref{color:#05060f}
header b{background:linear-gradient(90deg,#8f86ff,#5de0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.pb{background:linear-gradient(135deg,#6c5cff,#2f7bff);color:#fff;box-shadow:0 0 16px rgba(108,92,255,.4);transition:transform .15s}
.pb:active{transform:scale(.96)}
section.on{animation:sin .35s both}@keyframes sin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.m{animation:sin .3s both}
nav button.on span{filter:drop-shadow(0 0 6px #7c6cff)}
@media(prefers-reduced-motion:reduce){section.on,.m{animation:none}}
/* Kirish slaydlari */
#intro{position:fixed;inset:0;z-index:50;background:#05060f;color:#e9ecff;display:flex;flex-direction:column;transition:opacity .5s}
#intro.off{opacity:0;pointer-events:none}
#ic{position:absolute;inset:0;width:100%;height:100%}
.sk{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:2;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#e9ecff;border-radius:16px;padding:6px 14px;font-size:14px;backdrop-filter:blur(8px)}
.gl{position:relative;z-index:2;margin:auto 14px calc(env(safe-area-inset-bottom,0px) + 18px);padding:22px 20px;border-radius:24px;background:rgba(20,22,48,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(140,130,255,.35);box-shadow:0 0 44px rgba(108,92,255,.28)}
.gl h1{font:700 27px/1.2 Georgia,serif;margin:0 0 8px;background:linear-gradient(90deg,#fff,#8fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.gl p{margin:0 0 18px;color:#b9c0e8}
.gl .t{animation:up .6s both}.gl .t2{animation:up .6s .12s both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.gf{display:flex;align-items:center;justify-content:space-between}
.dt{display:flex;gap:7px}.dt i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.25);transition:all .3s}.dt i.on{width:26px;background:linear-gradient(90deg,#6c5cff,#5de0ff)}
.nx{background:linear-gradient(135deg,#6c5cff,#2f7bff);color:#fff;border:0;border-radius:14px;padding:12px 22px;font-weight:700;box-shadow:0 0 22px rgba(108,92,255,.6)}
@media(prefers-reduced-motion:reduce){.gl .t,.gl .t2{animation:none}}
</style></head>
<body>
<header><b id="lg" style="cursor:pointer">Manba</b><button class="ib" id="th" aria-label="Mavzuni almashtirish">🌓</button><button class="ib" id="gs" aria-label="Sozlamalar">⚙️</button></header>
<main>
<section id="v-src" class="on">
 <div class="cd"><h2>Yangi manba</h2>
  <label for="sn">Nomi</label><input type="text" id="sn" placeholder="Masalan: Tarix, 3-mavzu">
  <label for="st">Matn</label><textarea id="st" placeholder="Matnni shu yerga qo'ying"></textarea>
  <div class="row"><button class="pb" id="sa">Manba qo'shish</button>
  <label class="sb" style="margin:0;color:inherit">Fayl yuklash (PDF, .txt, .md)<input type="file" id="sf" accept=".txt,.md,.csv,.pdf,text/*,application/pdf" multiple hidden></label></div>
 </div>
 <div class="cd"><h2>Manbalaringiz</h2><div id="sl"></div></div>
</section>
<section id="v-chat">
 <div class="bar"><select id="cs" aria-label="Suhbat"></select>
  <button class="ib" id="cn" title="Yangi suhbat">＋</button><button class="ib" id="cr" title="Nomini o'zgartirish">✎</button><button class="ib" id="cd" title="O'chirish">🗑</button></div>
 <div id="msgs" aria-live="polite"></div>
 <div id="pan"></div>
 <div class="in"><textarea id="q" placeholder="Manbalaringiz bo'yicha savol bering" rows="1"></textarea><button class="pb" id="sd">Yuborish</button></div>
</section>
<section id="v-set">
 <div class="cd"><h2>AI ulanishi (OpenRouter)</h2>
  <label for="k">API kalit</label><input type="password" id="k" autocomplete="off" placeholder="sk-or-...">
  <label for="m">Asosiy model</label><input type="text" id="m" placeholder="model-nomi:free">
  <label for="f">Zaxira modellar (vergul bilan)</label><input type="text" id="f">
  <div class="row"><button class="pb" id="ff">Bepul modellarni topish</button><button class="sb" id="sv">Saqlash</button></div>
  <p id="ms" style="color:var(--mt);font-size:14px;margin:8px 0 0"></p>
 </div>
 <div class="cd"><h2>AI xarakteri</h2>
  <select id="ch"><option>do'stona</option><option>rasmiy</option><option>o'qituvchi</option></select></div>
 <div class="cd"><h2>Zaxira nusxa</h2>
  <div class="row"><button class="sb" id="ex">Eksport (JSON)</button>
  <label class="sb" style="margin:0;color:inherit">Import<input type="file" id="im" accept=".json" hidden></label></div>
  <p style="color:var(--mt);font-size:14px">Kalit eksportga kiritilmaydi. Ma'lumotlar faqat shu qurilmada saqlanadi.</p></div>
</section>
<section id="v-test">
 <div class="cd"><h2>Test</h2>
  <label for="ts">Manba</label><select id="ts" class="srcsel"></select>
  <label for="tn">Savollar soni</label><select id="tn"><option>5</option><option selected>10</option><option>15</option></select>
  <div class="row"><button class="pb" id="tg">Test tuzish</button></div><p id="tm" class="mt"></p></div>
 <div id="tq"></div>
</section>
<section id="v-card">
 <div class="cd"><h2>Flashcard</h2>
  <label for="fs">Manba</label><select id="fs" class="srcsel"></select>
  <div class="row"><button class="pb" id="fg">10 ta karta tuzish</button><button class="sb" id="fr">Takrorlashni boshlash</button></div>
  <p id="fm" class="mt"></p></div>
 <div id="fa"></div>
</section>
<section id="v-tool">
 <div class="cd"><h2>Vositalar</h2><div class="chips" id="tc"></div>
  <label for="ti" id="tl">Matn</label><textarea id="ti"></textarea>
  <div id="tpw" hidden><label for="tp" id="tpl"></label><input type="text" id="tp"></div>
  <div class="row"><button class="pb" id="tgo">Bajarish</button></div>
  <div id="tr"></div></div>
</section>
<section id="v-stat"><div id="sx"></div></section>
</main>
<nav><button data-v="src" class="on"><span>📚</span>Manbalar</button><button data-v="chat"><span>💬</span>Suhbat</button><button data-v="test"><span>❓</span>Test</button><button data-v="card"><span>🃏</span>Kartalar</button><button data-v="tool"><span>🛠</span>Vositalar</button><button data-v="stat"><span>📊</span>Statistika</button></nav>
<div id="intro"><canvas id="ic"></canvas><button class="sk" id="isk">O'tkazib yuborish</button>
<div class="gl"><h1 id="ih" class="t"></h1><p id="ip" class="t2"></p><div class="gf"><div class="dt" id="id"></div><button class="nx" id="inx">Keyingisi</button></div></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={};try{S=JSON.parse(localStorage.getItem('manba_v1'))||{}}catch(e){}
S.src=S.src||[];S.chats=S.chats||[];S.set=S.set||{key:'',model:'',fb:'',ch:"do'stona"};
let warned=0;const save=()=>{try{localStorage.setItem('manba_v1',JSON.stringify(S))}catch(e){if(!warned++)alert("Xotira to'ldi: ayrim ma'lumotlar saqlanmadi. Eski manbalarni o'chiring.")}};
let busy=false;
function newChat(){const c={id:Date.now(),t:'Yangi suhbat',m:[]};S.chats.unshift(c);S.cur=c.id;save()}
if(!S.chats.length)newChat();
const cur=()=>S.chats.find(c=>c.id==S.cur)||S.chats[0];
document.documentElement.dataset.t=S.theme||'dark';
$('#th').onclick=()=>{const d=document.documentElement.dataset.t==='dark'||(!S.theme&&matchMedia('(prefers-color-scheme:dark)').matches);S.theme=d?'light':'dark';document.documentElement.dataset.t=S.theme;save()};
function show(v){document.querySelectorAll('section').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));

/* Manbalar */
function drawSrc(){$('#sl').innerHTML=S.src.length?S.src.map((s,i)=>`<div class="src"><div>${esc(s.name)}<br><small>${s.text.length} belgi</small></div><button class="sb" data-d="${i}">O'chirish</button></div>`).join(''):'<div class="empty">Hozircha manba yo\'q. Yuqoriga matn qo\'shing.</div>'}
$('#sl').onclick=e=>{const i=e.target.dataset.d;if(i!==undefined&&confirm("Manba o'chirilsinmi?")){S.src.splice(i,1);save();drawSrc()}};
$('#sa').onclick=()=>{const t=$('#st').value.trim();if(!t){alert('Matn kiriting.');return}S.src.push({name:$('#sn').value.trim()||'Manba '+(S.src.length+1),text:t});$('#sn').value=$('#st').value='';save();drawSrc()};
$('#sf').onchange=async e=>{for(const f of [...e.target.files]){try{const t=/\.pdf$/i.test(f.name)?await readPdf(f):await f.text();if(t.trim().length<20)alert(f.name+": matn topilmadi (skaner qilingan PDF bo'lishi mumkin).");else{S.src.push({name:f.name,text:t});bump('f');drawSrc()}}catch(x){alert(f.name+': '+x.message)}}e.target.value=''};

/* Qidiruv: matnni bo'laklarga bo'lish */
function chunks(){const a=[];S.src.forEach(s=>{let buf='';const push=()=>{if(buf.trim())a.push({name:s.name,text:buf.trim()});buf=''};s.text.split(/\n+/).forEach(p=>{if(buf.length+p.length>900)push();while(p.length>900){a.push({name:s.name,text:p.slice(0,900)});p=p.slice(900)}buf+=p+'\n'});push()});return a}
function pick(q){const all=chunks();const tot=all.reduce((n,c)=>n+c.text.length,0);let idx=all.map((_,i)=>i);
 if(tot>14000){const w=q.toLowerCase().match(/[\p{L}\p{N}']{3,}/gu)||[];
  idx=all.map((c,i)=>{const t=c.text.toLowerCase();return[w.reduce((n,x)=>n+(t.includes(x)?1:0),0),i]}).sort((a,b)=>b[0]-a[0]).slice(0,8).map(x=>x[1]).sort((a,b)=>a-b)}
 return idx.map((i,k)=>({n:k+1,name:all[i].name,text:all[i].text}))}

/* Suhbat */
function fmt(m,i){let h=esc(m.c).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
 if(m.refs)h=h.replace(/\[(\d+)\]/g,(x,n)=>m.refs[n]?`<button class="ref" data-i="${i}" data-n="${n}" aria-label="Manba ${n}">${n}</button>`:x);
 if(m.r==='a'&&!m.e)h+=`<br><button class="tts" data-s="${i}">🔊 O'qib ber</button>`;return h}
function draw(){const c=cur();
 $('#cs').innerHTML=S.chats.map(x=>`<option value="${x.id}"${x.id==c.id?' selected':''}>${esc(x.t)}</option>`).join('');
 $('#msgs').innerHTML=(c.m.length?'':'<div class="empty">Manbalar bo\'limiga matn qo\'shing, so\'ng savol bering. Javoblar faqat manbadan olinadi.</div>')
  +c.m.map((m,i)=>`<div class="m ${m.e?'e':m.r}">${fmt(m,i)}</div>`).join('')
  +(busy?'<div class="m a"><span class="dots">Yozmoqda<i>.</i><i>.</i><i>.</i></span></div>':'');
 $('#msgs').scrollTop=1e9}
$('#cs').onchange=e=>{S.cur=+e.target.value;save();$('#pan').className='';draw()};
$('#cn').onclick=()=>{newChat();draw()};
$('#cr').onclick=()=>{const t=prompt('Yangi nom:',cur().t);if(t){cur().t=t.slice(0,40);save();draw()}};
$('#cd').onclick=()=>{if(!confirm("Suhbat o'chirilsinmi?"))return;S.chats=S.chats.filter(c=>c.id!=S.cur);if(!S.chats.length)newChat();S.cur=S.chats[0].id;save();draw()};
$('#msgs').onclick=e=>{const b=e.target;
 if(b.dataset.n){const r=cur().m[b.dataset.i].refs[b.dataset.n];$('#pan').textContent=r;$('#pan').className='on'}
 if(b.dataset.s){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cur().m[b.dataset.s].c.replace(/\[\d+\]/g,''));u.lang='uz-UZ';speechSynthesis.speak(u)}};
$('#pan').onclick=()=>$('#pan').className='';
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('#sd').onclick=send;
async function send(){const q=$('#q').value.trim();if(!q||busy)return;const s=S.set,c=cur();
 if(!s.key||!s.model){alert('Avval Sozlamalarda API kalit va modelni kiriting.');show('set');return}
 bump('m');c.m.push({r:'u',c:q});if(c.t==='Yangi suhbat')c.t=q.slice(0,30);$('#q').value='';
 if(!S.src.length){c.m.push({r:'a',c:"Avval Manbalar bo'limiga manba qo'shing."});save();draw();return}
 busy=true;save();draw();
 const refs=pick(q);
 const sys=`Sen "Manba" o'quv yordamchisisan. Xarakter: ${s.ch}. Faqat o'zbek tilida javob ber. FAQAT quyidagi MANBALAR asosida javob ber, o'zingdan hech narsa qo'shma. Har bir fikr oxiriga manba raqamini [n] ko'rinishida yoz. Javob manbalarda bo'lmasa, aynan shunday de: "Bu haqda manbalarda ma'lumot yo'q."\n\nMANBALAR:\n`+refs.map(x=>`[${x.n}] (${x.name}) ${x.text}`).join('\n\n');
 const hist=c.m.filter(m=>!m.e).slice(-7).map(m=>({role:m.r==='u'?'user':'assistant',content:m.c}));
 try{const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.key,'X-Title':'Manba'},
   body:JSON.stringify({models:[s.model,...s.fb.split(',').map(x=>x.trim()).filter(Boolean)],messages:[{role:'system',content:sys},...hist]})});
  const d=await r.json();if(!r.ok||!d.choices)throw new Error((d.error&&d.error.message)||('Xato '+r.status));
  c.m.push({r:'a',c:d.choices[0].message.content||'(bo\'sh javob)',refs:Object.fromEntries(refs.map(x=>[x.n,x.name+': '+x.text]))});
 }catch(err){c.m.push({r:'a',e:1,c:'Xatolik: '+err.message+". Kalit va modelni tekshiring yoki zaxira model qo'shing."})}
 busy=false;save();draw()}

/* Sozlamalar */
function drawSet(){$('#k').value=S.set.key;$('#m').value=S.set.model;$('#f').value=S.set.fb;$('#ch').value=S.set.ch}
$('#sv').onclick=()=>{S.set={key:$('#k').value.trim(),model:$('#m').value.trim(),fb:$('#f').value.trim(),ch:$('#ch').value};save();$('#ms').textContent='Saqlandi.'};
$('#ch').onchange=()=>{S.set.ch=$('#ch').value;save()};
$('#ff').onclick=async()=>{$('#ms').textContent='Qidirilmoqda...';
 try{const d=await (await fetch('https://openrouter.ai/api/v1/models')).json();
  const f=d.data.filter(m=>m.id.endsWith(':free')).sort((a,b)=>(b.context_length||0)-(a.context_length||0)).slice(0,4).map(m=>m.id);

/* PDF */
function loadPdf(){return window.pdfjsLib?Promise.resolve():new Promise((ok,no)=>{const x=document.createElement('script');x.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';x.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';ok()};x.onerror=()=>no(new Error('PDF kutubxonasi yuklanmadi (internetni tekshiring)'));document.head.appendChild(x)})}
async function readPdf(f){await loadPdf();const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';for(let i=1;i<=d.numPages;i++){const c=await (await d.getPage(i)).getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n\n'}return t}
/* AI yordamchisi */
async function ai(msgs){const s=S.set;if(!s.key||!s.model)throw new Error('Sozlamalarda kalit va modelni kiriting');
 const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.key,'X-Title':'Manba'},body:JSON.stringify({models:[s.model,...s.fb.split(',').map(x=>x.trim()).filter(Boolean)],messages:msgs})});
 const d=await r.json();if(!r.ok||!d.choices)throw new Error((d.error&&d.error.message)||('Xato '+r.status));return d.choices[0].message.content||''}
function jarr(t){const a=t.indexOf('['),b=t.lastIndexOf(']');if(a<0||b<a)throw new Error("AI javobi noto'g'ri formatda, qayta urinib ko'ring");return JSON.parse(t.slice(a,b+1))}
function srcText(v){const t=(v==='all'?S.src:[S.src[v]]).filter(Boolean).map(x=>x.text).join('\n\n');if(t.length<=12000)return t;let o='';for(let i=0;i<8;i++){const p=Math.floor(Math.random()*(t.length-1500));o+=t.slice(p,p+1500)+'\n...\n'}return o}
function fillSel(){document.querySelectorAll('.srcsel').forEach(e=>{const v=e.value;e.innerHTML='<option value="all">Barcha manbalar</option>'+S.src.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join('');if([...e.options].some(o=>o.value===v))e.value=v})}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',fillSel));fillSel();
/* Test */

function wrongHtml(){return S.wrong&&S.wrong.length?'<div class="cd"><h2>Xatolar tarixi (oxirgi 10)</h2>'+S.wrong.map(w=>`<p class="mt"><b>${esc(w.q)}</b><br>To'g'ri: ${esc(w.c)}</p>`).join('')+'</div>':''}
$('#tg').onclick=async()=>{if(!S.src.length){$('#tm').textContent="Avval Manbalar bo'limiga manba qo'shing.";return}
 $('#tm').textContent='Tuzilmoqda...';
 try{const t=await ai([{role:'system',content:`Faqat berilgan matn asosida ${$('#tn').value} ta test savoli tuz, o'zbek tilida. Faqat JSON massiv qaytar, boshqa hech narsa yozma: [{"q":"savol","o":["variant","variant","variant","variant"],"a":0,"e":"qisqa izoh"}]. "a" - to'g'ri variant indeksi (0-3), joylashuvi tasodifiy bo'lsin.`},{role:'user',content:srcText($('#ts').value)}]);
  const qs=jarr(t).filter(x=>x.q&&Array.isArray(x.o)&&x.o.length===4&&Number(x.a)>=0&&Number(x.a)<4);if(!qs.length)throw new Error("Savollar tuzilmadi, qayta urinib ko'ring");
  T={qs,i:0,sc:0,w:[],done:-1};$('#tm').textContent='';tdraw()}catch(e){$('#tm').textContent='Xatolik: '+e.message}};
function tdraw(){const el=$('#tq');
 if(T.i>=T.qs.length){if(!T.fin){T.fin=1;bump('t')}const p=Math.round(T.sc/T.qs.length*100);el.innerHTML=`<div class="cd"><h2>Natija: ${T.sc} / ${T.qs.length} (${p}%)</h2><div class="pr"><i style="width:${p}%"></i></div>`+(T.w.length?T.w.map(w=>`<p><b>${esc(w.q)}</b><br>To'g'ri: ${esc(w.c)}<br><span class="mt">${esc(w.e||'')}</span></p>`).join(''):"<p>Hammasi to'g'ri! 🎉</p>")+'</div>'+wrongHtml();return}
 const q=T.qs[T.i];el.innerHTML=`<div class="cd"><div class="pr"><i style="width:${T.i/T.qs.length*100}%"></i></div><small class="mt">${T.i+1} / ${T.qs.length}</small><h2>${esc(q.q)}</h2>`+q.o.map((o,k)=>`<button class="opt" data-k="${k}">${'ABCD'[k]}. ${esc(o)}</button>`).join('')+'<div id="ex2"></div></div>'}
$('#tq').onclick=e=>{if(!T)return;if(e.target.id==='tnx'){T.i++;tdraw();return}
 const b=e.target.closest('.opt');if(!b||T.done===T.i)return;T.done=T.i;
 const q=T.qs[T.i],k=+b.dataset.k,c=Number(q.a);
 document.querySelectorAll('.opt').forEach((x,j)=>{if(j===c)x.classList.add('ok');else if(j===k)x.classList.add('no')});
 if(k===c)T.sc++;else{T.w.push({q:q.q,c:q.o[c],e:q.e});S.wrong=[{q:q.q,c:q.o[c]},...(S.wrong||[])].slice(0,10);save()}
 $('#ex2').innerHTML=`<p class="mt">${esc(q.e||'')}</p><button class="pb" id="tnx">${T.i+1<T.qs.length?'Keyingisi':"Natijani ko'rish"}</button>`};
$('#tq').innerHTML=wrongHtml();
/* Flashcard (Leitner) */
S.cards=S.cards||[];const DAY=864e5,IV=[0,1,3,7,14];let Q=[];
const due=()=>S.cards.filter(c=>c.due<=Date.now());
function fstat(){$('#fa').innerHTML=`<div class="cd"><h2>Statistika</h2><p>Jami: ${S.cards.length} · Bugun takrorlash: ${due().length} · O'zlashtirilgan: ${S.cards.filter(c=>c.box>=4).length}</p></div>`}
$('#fg').onclick=async()=>{if(!S.src.length){$('#fm').textContent="Avval Manbalar bo'limiga manba qo'shing.";return}
 $('#fm').textContent='Tuzilmoqda...';
 try{const t=await ai([{role:'system',content:`Faqat berilgan matn asosida 10 ta flashcard tuz, o'zbek tilida: oldi tomonida savol yoki atama, orqasida qisqa javob. Faqat JSON massiv qaytar: [{"f":"savol","b":"javob"}]`},{role:'user',content:srcText($('#fs').value)}]);
  const a=jarr(t).filter(x=>x.f&&x.b);if(!a.length)throw new Error('Kartalar tuzilmadi');
  const n=$('#fs').selectedOptions[0].textContent;a.forEach(x=>S.cards.push({f:String(x.f),b:String(x.b),s:n,box:1,due:0}));save();$('#fm').textContent=a.length+" ta karta qo'shildi.";fstat()}catch(e){$('#fm').textContent='Xatolik: '+e.message}};
$('#fr').onclick=()=>{Q=due().sort(()=>Math.random()-.5);if(!Q.length){$('#fm').textContent="Hozircha takrorlanadigan karta yo'q.";fstat();return}$('#fm').textContent='';fdraw()};
function fdraw(){const c=Q[0];if(!c){$('#fm').textContent='Takrorlash tugadi 👏';fstat();return}
 $('#fa').innerHTML=`<small class="mt">Qolgan: ${Q.length}. Kartani bosib ag'daring.</small><div class="fc" id="fc"><div class="fi"><div class="ff">${esc(c.f)}</div><div class="fb2">${esc(c.b)}</div></div></div><div class="row" id="fbt" hidden><button class="pb" id="kn">Bilaman</button><button class="sb" id="dk">Bilmayman</button></div>`}
$('#fa').onclick=e=>{const id=e.target.id;
 if(e.target.closest('#fc')){$('#fc').classList.toggle('flip');$('#fbt').hidden=false;return}
 if(id==='kn'||id==='dk'){const c=Q.shift();bump('k');if(id==='kn'){c.box=Math.min(c.box+1,5);c.due=Date.now()+IV[c.box-1]*DAY}else{c.box=1;c.due=0;Q.push(c)}save();fdraw()}};
fstat();

/* Statistika */
S.st=S.st||{days:{},goal:10};
const dk=n=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4-n*864e5).toISOString().slice(0,10);
function bump(k){const d=S.st.days,t=dk(0);d[t]=d[t]||{m:0,t:0,f:0,k:0,a:0};d[t][k]++;save()}
const act=x=>x?x.m+x.t+x.f+x.k+x.a:0;
function sdraw(){const d=S.st.days,td=act(d[dk(0)]);let streak=0;for(let i=td?0:1;act(d[dk(i)]);i++)streak++;
 const wk=[...Array(7)].map((_,i)=>dk(6-i)),mx=Math.max(1,...wk.map(x=>act(d[x]))),L=['Ya','Du','Se','Ch','Pa','Ju','Sh'];
 const sum=k=>Object.values(d).reduce((n,x)=>n+(x[k]||0),0),pc=Math.min(100,Math.round(td/S.st.goal*100));
 $('#sx').innerHTML=`<div class="cd"><div class="big">🔥 ${streak}</div><span class="mt">kunlik seriya</span></div>
 <div class="cd"><h2>Kunlik maqsad</h2><p class="mt">${td} / ${S.st.goal} amal (${pc}%)</p><div class="pr"><i style="width:${pc}%"></i></div><button class="sb" id="sgl">Maqsadni o'zgartirish</button></div>
 <div class="cd"><h2>Haftalik faollik</h2><div class="wk">${wk.map(x=>`<div><i style="height:${act(d[x])/mx*85}%"></i>${L[new Date(x).getDay()]}</div>`).join('')}</div></div>
 <div class="cd"><div class="sg"><div><b>${sum('m')}</b>xabar</div><div><b>${sum('t')}</b>test</div><div><b>${sum('f')}</b>fayl</div><div><b>${sum('k')}</b>karta</div><div><b>${sum('a')}</b>vosita</div><div><b>${S.cards.length}</b>jami karta</div></div></div>`+wrongHtml()}
$('#sx').onclick=e=>{if(e.target.id==='sgl'){const g=parseInt(prompt('Kunlik maqsad (amallar soni):',S.st.goal));if(g>0){S.st.goal=g;save();sdraw()}}};
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.v==='stat')sdraw()}));
$('#gs').onclick=()=>show('set');
/* Vositalar */
const TL={sum:['Xulosa','Matn','',"Berilgan matnni o'zbek tilida qisqa xulosa qil: asosiy fikrlarni ro'yxat qilib ber."],
 tr:['Tarjima','Matn','Qaysi tilga?',"Berilgan matnni foydalanuvchi aytgan tilga tarjima qil (til aytilmasa, ingliz tiliga). Faqat tarjimani yoz."],
 code:['Kod yordamchi','Savol yoki kod','',"Dasturlash yordamchisisan: kod yozib ber yoki berilgan kodni tushuntir. Tushuntirishni o'zbek tilida yoz, kodni ``` blokida ber."],

let tk='sum';

const rich=t=>t.split('```').map((x,i)=>i%2?`<pre>${esc(x.replace(/^\w*\n/,''))}</pre>`:esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')).join('');

$('#tgo').onclick=async()=>{const t=$('#ti').value.trim();if(!t){$('#tr').textContent='Matn kiriting.';return}

 try{TR=await ai([{role:'system',content:TL[tk][3]},{role:'user',content:($('#tp').value.trim()&&!$('#tpw').hidden?'('+$('#tp').value.trim()+')\n':'')+t}]);bump('a');
  $('#tr').innerHTML='<div class="cd">'+rich(TR)+'<div class="row"><button class="sb" id="tcp">Nusxa olish</button><button class="sb" id="tsp">🔊 O\'qib ber</button></div></div>'}
 catch(e){$('#tr').innerHTML='<span style="color:var(--er)">Xatolik: '+esc(e.message)+'</span>'}};
$('#tr').onclick=e=>{if(e.target.id==='tcp')navigator.clipboard&&navigator.clipboard.writeText(TR);if(e.target.id==='tsp'){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(TR.replace(/```[\s\S]*?```/g,'')))}};

/* Kirish slaydlari (canvas animatsiya) */
const IS=[["Manbalaringiz — bilimga","PDF va matnlaringiz tartibli o'quv materialiga aylanadi."],["Faqat manbadan javob","Har javobda iqtibos bor, AI o'zidan to'qimaydi."],["Test, kartalar, takrorlash","Imtihonga tizimli va qiziqarli tayyorlaning."],["Bilim sizniki","Har kuni oz-ozdan o'qing, seriyani saqlang 🔥"]];
let ix=0,run=false,W=1,H=1,P=[],tm=0;const cv=$('#ic'),g=cv.getContext('2d'),sp=matchMedia('(prefers-reduced-motion:reduce)').matches?.15:1;
function initP(){P=[];const n=ix===1?70:ix===0?90:0;for(let i=0;i<n;i++)P.push(ix===1?{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*W/600,vy:(Math.random()-.5)*W/600}:{a:Math.random()*6.28,r:Math.random()*.5+.08})}
function rs(){const r=devicePixelRatio||1;W=cv.width=innerWidth*r;H=cv.height=innerHeight*r;initP()}
addEventListener('resize',()=>{if(run)rs()});
function glow(x,y,r,c,a){const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,`rgba(${c},${a})`);q.addColorStop(1,`rgba(${c},0)`);g.fillStyle=q;g.beginPath();g.arc(x,y,r,0,6.283);g.fill()}
function fr(){tm+=.016*sp;g.fillStyle='rgba(5,6,15,.26)';g.fillRect(0,0,W,H);const u=W/400,cx=W/2,cy=H*.3;
 if(ix===0){P.forEach(p=>{p.a+=.014*sp/(p.r+.12);p.r-=.0010*sp;if(p.r<.03){p.r=.55;p.a=Math.random()*6.28}
  const R=p.r*W*.95,x=cx+Math.cos(p.a)*R,y=cy+Math.sin(p.a)*R*.5,t=1-p.r/.6,w=(8-t*5)*u,h=(10-t*6)*u;
  g.save();g.translate(x,y);g.rotate(p.a*2);g.fillStyle=`hsla(${250-t*70},90%,${62+t*18}%,${.25+t*.7})`;g.fillRect(-w/2,-h/2,w,h);g.restore()});
  glow(cx,cy,70*u,'108,92,255',.5+.15*Math.sin(tm*3))}
 else if(ix===1){P.forEach(p=>{p.x+=p.vx*sp;p.y+=p.vy*sp;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H*.62)p.vy*=-1});
  for(let i=0;i<P.length;i++){for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);if(d<95*u){g.strokeStyle=`rgba(120,150,255,${(1-d/(95*u))*.7})`;g.lineWidth=u*.8;g.beginPath();g.moveTo(P[i].x,P[i].y);g.lineTo(P[j].x,P[j].y);g.stroke()}}
   g.fillStyle='rgba(140,220,255,.9)';g.beginPath();g.arc(P[i].x,P[i].y,2*u,0,6.283);g.fill()}}
 else if(ix===2){g.lineWidth=1.5*u;[[52,0,[4,10]],[80,1,[14,8]],[112,-1,[2,12]]].forEach(([r,d,l])=>{g.strokeStyle='rgba(90,200,255,.55)';g.setLineDash(l.map(v=>v*u));g.lineDashOffset=-tm*30*u*(d||1);g.beginPath();g.arc(cx,cy,r*u,0,6.283);g.stroke()});g.setLineDash([]);
  glow(cx,cy,62*u,'60,140,255',.55);g.font=`${44*u}px sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText('🎓',cx,cy);
  ['📖','🌐','📋','▶️','🧠'].forEach((e,k)=>{const a=tm*.6+k*1.2566,x=cx+Math.cos(a)*96*u,y=cy+Math.sin(a)*96*u;glow(x,y,22*u,'80,160,255',.5);g.font=`${20*u}px sans-serif`;g.fillText(e,x,y)})}
 else{for(let k=0;k<3;k++){const r=((tm*35+k*50)%150)*u;g.strokeStyle=`rgba(120,110,255,${1-r/(150*u)})`;g.lineWidth=2*u;g.beginPath();g.arc(cx,cy,r+30*u,0,6.283);g.stroke()}
  glow(cx,cy,(70+6*Math.sin(tm*2))*u,'108,92,255',.8);glow(cx,cy,38*u,'160,240,255',.9);g.font=`${34*u}px sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText('📖',cx,cy);
  for(let k=0;k<6;k++){const a=k*1.047+.3,b=Math.sin(tm*2+k)*3*u,x=cx+Math.cos(a)*125*u,y=cy+Math.sin(a)*70*u+b;g.fillStyle='rgba(160,150,255,.75)';g.beginPath();g.arc(x,y-9*u,5*u,0,6.283);g.fill();g.beginPath();g.arc(x,y+9*u,10*u,Math.PI,0);g.fill()}}
}
function loop(){if(!run)return;fr();requestAnimationFrame(loop)}
function ish(){$('#ih').textContent=IS[ix][0];$('#ip').textContent=IS[ix][1];$('#inx').textContent=ix<3?'Keyingisi':'Boshlash';$('#id').innerHTML=IS.map((_,i)=>`<i class="${i===ix?'on':''}"></i>`).join('');
 [$('#ih'),$('#ip')].forEach(e=>{e.style.animation='none';e.offsetWidth;e.style.animation=''});initP()}
function go(d){ix=Math.max(0,Math.min(3,ix+d));ish()}
function closeI(){S.intro=1;save();run=false;$('#intro').classList.add('off');setTimeout(()=>$('#intro').hidden=true,500)}
function openI(){ix=0;$('#intro').hidden=false;$('#intro').classList.remove('off');ish();if(!run){run=true;rs();loop()}}
$('#inx').onclick=()=>ix<3?go(1):closeI();$('#isk').onclick=closeI;$('#lg').onclick=openI;
let tx=0;$('#intro').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('#intro').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(d<0?1:-1)},{passive:true});
if(S.intro)$('#intro').hidden=true;else openI();
drawSrc();drawSet();draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
